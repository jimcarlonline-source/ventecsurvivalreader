name: Build VEN-TEC APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for Android SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-32" "build-tools;32.0.0"

      - name: Set up JDK 11 (for the Cordova build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Gradle 7.6.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -O /tmp/gradle.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo "/opt/gradle-7.6.4/bin" >> "$GITHUB_PATH"

      - name: Show Gradle + Java versions
        run: |
          gradle -version
          java -version

      - name: Install Cordova CLI
        run: npm install -g cordova@12.0.0

      - name: Add Android platform (minSdk 22 / Android 5.1)
        run: cordova platform add android@11.0.0 --no-telemetry

      - name: Build debug APK
        run: cordova build android --no-telemetry

      - name: Locate APK
        id: apk
        run: |
          FILE=$(find platforms/android -name "*-debug.apk" | head -n 1)
          echo "Found APK at: $FILE"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ventec-pip-reader-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
